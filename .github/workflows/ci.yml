name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@51e903041baee366ef04608cbdba04e5663c4e2d # swift-ci 51e9030
    permissions:
      contents: write # required by the reusable workflow; this library does not publish archives

