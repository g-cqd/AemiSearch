name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@7bcf4c5eb9f9dc47cd0d2916adf167c1de5c6567 # swift-ci 7bcf4c5
    permissions:
      contents: write # required by the reusable workflow; this library does not publish archives

